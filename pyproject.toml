[project]
name = "transition-element-framework"
version = "0.1.0"
description = "A markdown-based static website for climate mitigation documentation"
authors = [
    {name = "Mark", email = "mark@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mkdocs==1.6.1",
    "mkdocs-bibtex==2.16.0",
    "mkdocs-drawio==1.16.3",
    "mkdocs-get-deps==0.2.2",
    "mkdocs-glightbox==0.5.3",
    "mkdocs-macros-plugin==1.5.0",
    "mkdocs-material==9.8.0",
    "mkdocs-material-extensions==1.3.1",
    "pybtex==0.26.1",
    "pymdown-extensions==12.3",
    "pypandoc==1.17",
    "python-frontmatter==1.3.0",
    "PyYAML==6.0.3",
    "pyyaml_env_tag==1.1",
    "tree-sitter==0.26.0",
    "tree-sitter-markdown==0.5.4",
    "tree-sitter-yaml==0.7.2",
    "pytest==9.2.0",
    "flake8==7.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=9.2.0",
    "flake8",
]

